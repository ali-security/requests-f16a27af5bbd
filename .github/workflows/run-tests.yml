name: Tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector arguments; empty runs the full suite"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "pypy-3.8", "pypy-3.9"]
        os: [ubuntu-22.04, macOS-latest, windows-latest]
        exclude:
          # CPython 3.7 has no arm64 macOS build and cannot be built from
          # source there (Homebrew dropped openssl@1.1); run it on Intel macOS.
          - python-version: "3.7"
            os: macOS-latest
        include:
          - python-version: "3.7"
            os: macos-15-intel
          # pypy-3.7 on Windows and Mac OS currently fails trying to compile
          # cryptography. Moving pypy-3.7 to only test linux.
          - python-version: pypy-3.7
            os: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      if: runner.os != 'macOS' || runner.arch != 'ARM64'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Python ${{ matrix.python-version }} (macOS arm64)
      if: runner.os == 'macOS' && runner.arch == 'ARM64'
      uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache-build: true
        allow-build: allow
    - name: Install dependencies
      run: |
        make
    - name: Run tests
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          pytest tests --junitxml=report.xml ${{ inputs.test-filter }}
        else
          make ci
        fi
    - name: Build sdist and wheel
      if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.11'
      run: |
        python -m pip install build==0.10.0 wheel==0.40.0 setuptools==67.8.0
        python -m build --no-isolation
    - name: Upload distributions
      if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: requests-dist
        path: dist/*
        if-no-files-found: error
